plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.76'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'net.neoforged.moddev'

    println "Setup: ${project.name}"

    version = "${minecraft_version}-${mod_version}"
    group = 'fr.modcraftmc.datasync'
    archivesBaseName = "${project.name}"

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds' // Avoid caching changing modules
    }

    repositories {
        mavenLocal()
        maven { url = 'https://maven.modcraftmc.fr/releases' }
        maven { url = 'https://maven.modcraftmc.fr/snapshots' }
        maven {
            name "CurseMaven"
            url "https://cursemaven.com"
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
    }

    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        implementation ('fr.modcraftmc:cross-server-core:1.21.1-2.0.0:api') {changing = true}
        implementation('com.google.code.gson:gson:2.8.8')
    }

    neoForge {
        version = project.neo_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

        runs {
            client {
                client()
            }

            server {
                server()
            }
        }

        mods {
            // define mod <-> source bindings
            // these are used to tell the game which sources are for which mod
            // mostly optional in a single mod project
            // but multi mod projects should define one per mod
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }

    sourceSets.main.resources { srcDir 'src/generated/resources' }

    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    jar {
        manifest {
            attributes([
                    "Specification-Title"     : "${project.name}",
                    "Specification-Vendor"    : "ModcraftMC",
                    "Specification-Version"   : "${mod_version}",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : "ModcraftMC",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "TweakClass"              : "org.spongepowered.asm.launch.MixinTweaker",
                    "TweakOrder"              : "0",
                    "MixinConfigs"            : "${project.name}.mixin.json"
            ])
        }

        //rename 'mixin.refmap.json', 'datasync.mixin-refmap.json'
    }

    tasks.register('copyJars', Copy) {
        from jar
        into "../builds"
    }
    build.finalizedBy copyJars
}
repositories {
    maven {
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    implementation (group: 'org.mongodb', name: 'mongodb-driver-sync', version: '[5.3.0,)')

    implementation("maven.modrinth:sophisticated-backpacks:1.21.1-3.23.5.1199")
    implementation("maven.modrinth:sophisticated-core:1.21.1-1.2.21.884")
}